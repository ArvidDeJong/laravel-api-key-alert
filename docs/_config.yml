title: Laravel API Key Alert
description: "darvis/laravel-api-key-alert sends you an email the moment an API key stops working in a Laravel app. It recognises rejected keys in Http client calls, reported exceptions, wrapped calls and an optional daily check, and mails once more when the key works again."
url: https://arviddejong.github.io
baseurl: /laravel-api-key-alert

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/laravel-api-key-alert
  repository: https://github.com/ArvidDeJong/laravel-api-key-alert
  packagist: https://packagist.org/packages/darvis/laravel-api-key-alert
  license_url: https://github.com/ArvidDeJong/laravel-api-key-alert/blob/main/LICENSE
  requires: "PHP 8.2+, Laravel 11, 12 or 13, a working mailer"
  platforms: [Laravel]
  keywords: [laravel, api key, api key monitoring, expired api key, revoked api key, google maps request denied, openai invalid api key, mollie unauthorized, alert email, health check, laravel boost]

# Developer credit in the footer and the structured data.
